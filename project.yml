name: Playloom
options:
  bundleIdPrefix: mix.cori
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGNING_ALLOWED: NO
    PRODUCT_BUNDLE_IDENTIFIER: mix.cori.Playloom
targets:
  Playloom:
    type: application
    platform: iOS
    sources:
      - path: Playloom
    resources:
      - path: Playloom/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Playloom
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  PlayloomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PlayloomTests
    dependencies:
      - target: Playloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mix.cori.PlayloomTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Playloom.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Playloom"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Playloom:
    build:
      targets:
        Playloom: all
        PlayloomTests: [test]
    test:
      targets:
        - PlayloomTests
