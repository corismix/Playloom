name: live-smoke
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  opencode-go:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      PLAYLOOM_OPENCODE_GO_KEY: "${{ secrets.PLAYLOOM_OPENCODE_GO_KEY }}"
      PLAYLOOM_ARTIFACT_DIR: ${{ github.workspace }}/generated-projects
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Inject ephemeral live key into test app bundle
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLAYLOOM_OPENCODE_GO_KEY"
          printf '%s' "$PLAYLOOM_OPENCODE_GO_KEY" > Playloom/Resources/live-smoke-key.txt
      - run: xcodegen generate
      - id: sim
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Run exactly one live generation
        run: xcodebuild test -project Playloom.xcodeproj -scheme Playloom -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.device }}' -only-testing:PlayloomTests/OpenCodeGoLiveSmokeTests/testOneRealGenerationPassesFullValidationLoop CODE_SIGNING_ALLOWED=NO
      - name: Upload generated project directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-projects-${{ github.run_id }}
          path: generated-projects
          if-no-files-found: error
          retention-days: 14
