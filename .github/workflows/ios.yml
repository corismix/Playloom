name: ios

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    env:
      PLAYLOOM_ARTIFACT_DIR: ${{ github.workspace }}/generated-projects
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for runtime in d.values() for x in runtime if x["name"].startswith("iPhone")))')
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: >-
          xcodebuild test
          -project Playloom.xcodeproj
          -scheme Playloom
          -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}'
          -parallel-testing-enabled NO
          CODE_SIGNING_ALLOWED=NO
      - name: Collect generated project directories
        if: always()
        shell: bash
        run: |
          mkdir -p generated-projects
          find "$HOME/Library/Developer/CoreSimulator/Devices" -type d -name PlayloomWorkspace -print0 2>/dev/null | while IFS= read -r -d '' workspace; do
            find "$workspace" -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' project; do
              cp -R "$project" "generated-projects/$(basename "$project")"
            done
          done
      - name: Upload generated project directories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-projects-${{ github.run_id }}
          path: generated-projects
          if-no-files-found: error
          retention-days: 14
      - name: Prohibited-name and secret scan
        shell: bash
        run: |
          set -euo pipefail
          prohibited_name=$(printf '\x63\x61\x73\x65\x79')
          if grep -RniE --exclude-dir=.git "$prohibited_name" .; then exit 1; fi
          if grep -RniE --exclude-dir=.git --exclude='*.md' '(sk-[A-Za-z0-9_-]{16,}|Bearer[[:space:]]+[A-Za-z0-9._-]{16,})' .; then exit 1; fi
